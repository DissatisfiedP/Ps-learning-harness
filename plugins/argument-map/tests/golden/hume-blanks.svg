<svg xmlns="http://www.w3.org/2000/svg" width="560" height="497" viewBox="0 0 560 497" fill="none" stroke="currentColor"><text fill="currentColor" font-family="system-ui, sans-serif" font-size="15" font-weight="700" stroke="none" x="16" y="31">Hume on induction</text><rect rx="4" stroke-width="1.5" x="16" y="47" width="528" height="54"/><text fill="currentColor" font-family="system-ui, sans-serif" font-size="13" font-weight="700" stroke="none" x="26" y="70">P1</text><text fill="currentColor" font-family="system-ui, sans-serif" font-size="13" stroke="none" x="62" y="70">Every inference from observed cases to unobserved ones assumes</text><text fill="currentColor" font-family="system-ui, sans-serif" font-size="13" stroke="none" x="62" y="88">that nature is uniform.</text><rect rx="4" stroke-width="1.5" x="16" y="109" width="528" height="54"/><text fill="currentColor" font-family="system-ui, sans-serif" font-size="13" font-weight="700" stroke="none" x="26" y="132">P2</text><text fill="currentColor" font-family="system-ui, sans-serif" font-size="13" stroke="none" x="62" y="132">That assumption can't be proved by pure reasoning, since denying</text><text fill="currentColor" font-family="system-ui, sans-serif" font-size="13" stroke="none" x="62" y="150">it involves no contradiction.</text><rect fill="currentColor" fill-opacity="0.06" rx="4" stroke-width="1.5" x="16" y="171" width="528" height="36"/><text fill="currentColor" font-family="system-ui, sans-serif" font-size="13" font-weight="700" stroke="none" x="26" y="194">P3</text><text fill="currentColor" font-family="system-ui, sans-serif" font-size="13" font-style="italic" stroke="none" x="62" y="194">? (fill in)</text><path stroke-width="1" d="M 30 207 V 231.5 H 44"/><rect rx="4" stroke-dasharray="6 4" stroke-width="1.5" x="44" y="215" width="500" height="54"/><text fill="currentColor" font-family="system-ui, sans-serif" font-size="13" font-weight="700" stroke="none" x="54" y="238">O1</text><text fill="currentColor" font-family="system-ui, sans-serif" font-size="13" font-weight="600" stroke="none" x="90" y="238">Objection to P3</text><text fill="currentColor" font-family="system-ui, sans-serif" font-size="13" stroke="none" x="90" y="256">Induction has worked every time so far, so it is reliable.</text><path stroke-width="1" d="M 58 269 V 293.5 H 72"/><rect fill="currentColor" fill-opacity="0.06" rx="4" stroke-dasharray="2 3" stroke-width="1.5" x="72" y="277" width="472" height="54"/><text fill="currentColor" font-family="system-ui, sans-serif" font-size="13" font-weight="700" stroke="none" x="82" y="300">O1.1</text><text fill="currentColor" font-family="system-ui, sans-serif" font-size="13" font-weight="600" stroke="none" x="121" y="300">Reply — Hume</text><text fill="currentColor" font-family="system-ui, sans-serif" font-size="13" font-style="italic" stroke="none" x="121" y="318">? (fill in)</text><line stroke-width="1" x1="16" y1="339" x2="544" y2="339"/><rect fill="currentColor" fill-opacity="0.06" rx="4" stroke-width="3" x="16" y="347" width="528" height="36"/><text fill="currentColor" font-family="system-ui, sans-serif" font-size="20" font-weight="700" stroke="none" x="26" y="370">∴</text><text fill="currentColor" font-family="system-ui, sans-serif" font-size="13" font-style="italic" stroke="none" x="62" y="370">? (fill in)</text><path stroke-width="1" d="M 30 383 V 407.5 H 44"/><rect rx="4" stroke-dasharray="6 4" stroke-width="1.5" x="44" y="391" width="500" height="90"/><text fill="currentColor" font-family="system-ui, sans-serif" font-size="13" font-weight="700" stroke="none" x="54" y="414">O2</text><text fill="currentColor" font-family="system-ui, sans-serif" font-size="13" font-weight="600" stroke="none" x="90" y="414">Objection to the inference — Strawson</text><text fill="currentColor" font-family="system-ui, sans-serif" font-size="13" stroke="none" x="90" y="432">Asking for a justification of induction as a whole is a</text><text fill="currentColor" font-family="system-ui, sans-serif" font-size="13" stroke="none" x="90" y="450">confusion: being inductively supported is what being</text><text fill="currentColor" font-family="system-ui, sans-serif" font-size="13" stroke="none" x="90" y="468">reasonable means here.</text></svg>