id = "argument-map"
version = "0.1.0"
api = 1
title = "Argument map card"
description = "Shows an argument as a pinned card of premises, conclusion, objections and replies, with parts the learner fills in."
license = "MIT"
platforms = ["desktop", "mobile"]
permissions = []
use_when = "Argument-mode sections with more than one argument or more than two objections, where the learner benefits from seeing which objection attacks which premise."
avoid_when = "A single short argument that fits in a numbered list."
cost = "instant"

[[tool]]
name = "argument_map_show"
description = "Draw an argument as a card: numbered premises, the conclusion, objections under the premise they attack, replies under their objection. `blanks` hides parts (premise or objection ids, `O1.1` for an objection's first reply, `conclusion`) for the learner to fill in; the result still tells you the hidden text. The card is an artifact; place it with ![alt](artifact:<id>)."
agents = ["tutor", "practice"]
input = "schemas/argument_map_show.json"
entry = "show"
artifact = true

[[renderer]]
entry = "render"

[prompts]
tutor = "prompts/tutor.md"
practice = "prompts/practice.md"
