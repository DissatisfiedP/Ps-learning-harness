<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circuit</title>
<style>
  :root {
    --paper: #fff; --ink: #1c1b19; --ink-2: #45423d; --rule: #e3dfd6; --accent: #2d5b4c; --on-accent: #fff;
    --font-ui: system-ui, sans-serif;
  }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 14px/1.4 var(--font-ui); }
  #app { padding: 8px; }
  .schematic { overflow-x: auto; }
  .schematic svg { max-width: 100%; height: auto; color: var(--ink); }
  .controls { display: grid; gap: 8px; margin-top: 12px; }
  .control { display: grid; grid-template-columns: 7rem 1fr 5.5rem; gap: 8px; align-items: center; }
  .control label { font-weight: 600; }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  output { text-align: right; font-variant-numeric: tabular-nums; }
  .toggles { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 12px; }
  .toggles label { display: inline-flex; gap: 6px; align-items: center; }
  .toggles input { accent-color: var(--accent); }
  table { border-collapse: collapse; margin-top: 12px; width: 100%; }
  caption { text-align: left; font-weight: 600; padding-bottom: 4px; }
  th, td { text-align: left; padding: 4px 8px; border-top: 1px solid var(--rule); font-variant-numeric: tabular-nums; }
  th { font-weight: 600; }
  sub { font-size: 0.75em; line-height: 0; }
  .warnings { color: var(--ink-2); margin-top: 8px; }
  .submit { margin-top: 12px; padding: 8px 14px; border: 0; border-radius: 4px; background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 600; cursor: pointer; }
  .submit:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>
</head>
<body>
<div id="app">
  <div class="schematic" id="schematic" role="img" aria-label="Circuit schematic"></div>
  <div class="controls" id="controls"></div>
  <div class="toggles" id="toggles" role="group" aria-label="Show on the schematic"></div>
  <table id="probes" hidden>
    <caption>Solved values</caption>
    <thead><tr><th scope="col">Probe</th><th scope="col">Value</th></tr></thead>
    <tbody></tbody>
  </table>
  <table id="parts" hidden>
    <caption>Parts</caption>
    <thead><tr><th scope="col">Part</th><th scope="col">Current</th><th scope="col">Power absorbed</th></tr></thead>
    <tbody></tbody>
  </table>
  <p class="warnings" id="warnings" role="status"></p>
  <button class="submit" id="submit" type="button" hidden>Submit answer</button>
</div>
<script>
(() => {
  let artifact = null;
  let spec = null;
  let answerMode = false;
  const pending = new Map();
  let nextId = 1;

  const schematic = document.getElementById('schematic');
  const controls = document.getElementById('controls');
  const toggles = document.getElementById('toggles');
  const probeTable = document.getElementById('probes');
  const partTable = document.getElementById('parts');
  const warnings = document.getElementById('warnings');
  const submit = document.getElementById('submit');

  const send = (message) => { message.protocol = 1; parent.postMessage(message, '*'); };
  const request = (fn, args) => new Promise((resolve, reject) => {
    const id = nextId++;
    pending.set(id, { resolve, reject });
    send({ type: 'call', id, fn, args });
  });
  // The host allows one call in flight per frame, so calls queue here.
  // `stale()` is checked when a call reaches the front: a superseded call
  // resolves to SKIPPED without reaching the bridge.
  const SKIPPED = Symbol('skipped');
  let chain = Promise.resolve();
  const call = (fn, args, stale = () => false) => {
    const p = chain.then(() => (stale() ? SKIPPED : request(fn, args)));
    chain = p.catch(() => {});
    return p;
  };
  const resize = () => send({ type: 'resize', height: Math.ceil(document.body.scrollHeight) });

  function complex(v) {
    if (typeof v === 'number') return { re: v, im: 0 };
    if (v && typeof v.re === 'number') return { re: v.re, im: v.im || 0 };
    return { re: 0, im: 0 };
  }
  const UNITS = { R: 'Ω', C: 'F', L: 'H', V: 'V', I: 'A', VCVS: '', VCCS: 'S', CCVS: 'Ω', CCCS: '' };
  const DEPENDENT = new Set(['VCVS', 'VCCS', 'CCVS', 'CCCS']);
  const PREFIXES = [[1e9, 'G'], [1e6, 'M'], [1e3, 'k'], [1, ''], [1e-3, 'm'], [1e-6, 'µ'], [1e-9, 'n'], [1e-12, 'p']];
  // Three significant digits, like the figure.
  const digits = (n) => String(Number(n.toPrecision(3)));
  function eng(v, unit) {
    const x = complex(v);
    const mag = Number(Math.hypot(x.re, x.im).toPrecision(3));
    const sign = Math.abs(x.im) <= 1e-9 && x.re < 0 && mag > 0 ? '−' : '';
    if (!unit) return sign + digits(mag);
    if (mag < 1e-12) return '0 ' + unit;
    const [scale, prefix] = PREFIXES.find(([s]) => mag >= s) || [1, ''];
    return sign + digits(mag / scale) + ' ' + prefix + unit;
  }
  function valueText(v, unit) {
    const x = complex(v);
    if (Math.abs(x.im) > 1e-9) {
      const phase = digits(Math.atan2(x.im, x.re) * 180 / Math.PI).replace('-', '−');
      return eng(x, unit) + ' ∠ ' + phase + '°';
    }
    return eng(x, unit);
  }

  // The subscript rule of the figure: R_1, V_out, I_{sc 2}.
  function runs(text) {
    const out = [];
    const re = /_(?:\{([^{}]*)\}|([A-Za-z0-9]+))/g;
    let at = 0;
    for (let m = re.exec(text); m; m = re.exec(text)) {
      if (m.index === 0) continue;
      out.push({ text: text.slice(at, m.index), sub: false });
      out.push({ text: m[1] !== undefined ? m[1] : m[2], sub: true });
      at = m.index + m[0].length;
    }
    out.push({ text: text.slice(at), sub: false });
    return out.filter((run) => run.text !== '');
  }
  // Fills `element` with `text`, subscripts as <sub>.
  function setLabel(element, text) {
    element.textContent = '';
    for (const run of runs(String(text))) {
      if (run.sub) {
        const sub = document.createElement('sub');
        sub.textContent = run.text;
        element.append(sub);
      } else {
        element.append(run.text);
      }
    }
  }
  const nameOf = (c) => c.label || c.id || c.type;
  // An empty Luau table reaches the view as {}, never []: a list that may be
  // empty is read through this.
  const list = (value) => (Array.isArray(value) ? value : []);

  function applyTheme(theme) {
    if (!theme) return;
    for (const [key, value] of Object.entries(theme)) {
      document.documentElement.style.setProperty('--' + key, value);
    }
  }

  // The request the solver and the renderer get: the learner's parts and
  // what the figure shows.
  const circuit = () => ({
    components: spec.components,
    analysis: spec.analysis,
    show: spec.show,
    annotations: spec.annotations,
  });

  function renderControls() {
    controls.textContent = '';
    for (const c of spec.components) {
      if (!c.adjustable || c.type === 'switch') continue;
      // A dependent source's slider moves its gain; any other part's, its value.
      const field = DEPENDENT.has(c.type) ? 'gain' : 'value';
      const row = document.createElement('div');
      row.className = 'control';
      const unit = UNITS[c.type] || '';
      const label = document.createElement('label');
      setLabel(label, nameOf(c));
      if (unit) label.append(' (' + unit + ')');
      const input = document.createElement('input');
      input.type = 'range';
      const min = c.adjustable.min;
      const max = c.adjustable.max;
      input.min = String(min);
      input.max = String(max);
      input.step = String(c.adjustable.step || (max - min) / 100);
      input.value = String(c[field] ?? min);
      input.id = 'slider-' + c.id;
      label.htmlFor = input.id;
      const out = document.createElement('output');
      out.htmlFor = input.id;
      const show = () => {
        const text = eng(Number(input.value), unit);
        out.textContent = text;
        input.setAttribute('aria-valuetext', text);
      };
      show();
      input.addEventListener('input', () => {
        c[field] = Number(input.value);
        show();
        solve();
      });
      row.append(label, input, out);
      controls.append(row);
    }
    for (const c of spec.components) {
      if (c.type !== 'switch' || !c.toggle) continue;
      const row = document.createElement('div');
      row.className = 'control';
      const label = document.createElement('label');
      setLabel(label, nameOf(c));
      const input = document.createElement('input');
      input.type = 'checkbox';
      input.checked = c.closed !== false;
      input.id = 'switch-' + c.id;
      label.htmlFor = input.id;
      const out = document.createElement('output');
      out.htmlFor = input.id;
      const show = () => { out.textContent = input.checked ? 'closed' : 'open'; };
      show();
      input.addEventListener('change', () => {
        c.closed = input.checked;
        show();
        solve();
      });
      row.append(label, input, out);
      controls.append(row);
    }
  }

  // What the learner may add to the schematic. Nothing is offered while a
  // probe is hidden: the solver then sends no node voltages or currents.
  const TOGGLES = [['nodes', 'Node names'], ['voltages', 'Node voltages'], ['currents', 'Currents']];
  function renderToggles() {
    toggles.textContent = '';
    if (spec.components.some((c) => c.type === 'probe' && c.hidden)) return;
    for (const [key, text] of TOGGLES) {
      const label = document.createElement('label');
      const input = document.createElement('input');
      input.type = 'checkbox';
      input.checked = Boolean(spec.show[key]);
      input.addEventListener('change', () => {
        spec.show[key] = input.checked;
        solve(false);
      });
      label.append(input, text);
      toggles.append(label);
    }
  }

  function setSchematic(markup) {
    schematic.innerHTML = markup || '';
    const svg = schematic.querySelector('svg');
    if (svg) svg.setAttribute('aria-hidden', 'true');
    resize();
  }

  // Slider moves can outrun the bridge; only the newest solve runs and is shown.
  let solveSeq = 0;
  async function solve(report = true) {
    if (!spec) return;
    const mine = ++solveSeq;
    const stale = () => mine !== solveSeq;
    try {
      const result = await call('solve', circuit(), stale);
      if (result === SKIPPED || stale()) return;
      showResult(result, report);
      const markup = await call('render', { ...circuit(), result }, stale);
      if (!stale() && typeof markup === 'string') setSchematic(markup);
    } catch (e) {
      if (!stale()) warnings.textContent = 'The circuit could not be solved.';
    }
  }

  function fillTable(table, rows) {
    table.hidden = rows.length === 0;
    const body = table.querySelector('tbody');
    body.textContent = '';
    for (const [name, ...cells] of rows) {
      const tr = document.createElement('tr');
      const th = document.createElement('th');
      th.scope = 'row';
      setLabel(th, name);
      tr.append(th);
      for (const cell of cells) {
        const td = document.createElement('td');
        td.textContent = cell;
        tr.append(td);
      }
      body.append(tr);
    }
  }

  // `report` is true only after the learner moved something: opening a
  // session must not send a state line for every figure on screen.
  function showResult(result, report) {
    const units = result.units || {};
    const rows = [];
    for (const [name, value] of Object.entries(result.probes || {})) {
      rows.push([name, valueText(value, units[name] || 'V')]);
    }
    // Hidden probes are the learner's unknown: the solver never sends their value.
    for (const c of spec.components) {
      if (c.type === 'probe' && c.hidden) rows.push([nameOf(c), '?']);
    }
    rows.sort((a, b) => a[0].localeCompare(b[0]));
    fillTable(probeTable, rows);

    const powers = result.powers || {};
    const parts = Object.entries(result.currents || {})
      .map(([name, current]) => [
        name,
        valueText(current, 'A'),
        powers[name] === undefined ? '' : eng(complex(powers[name]).re, 'W'),
      ])
      .sort((a, b) => a[0].localeCompare(b[0]));
    fillTable(partTable, parts);

    warnings.textContent = list(result.warnings).join(' ');
    if (report) {
      const changed = spec.components
        .filter((c) => (c.type === 'switch' ? c.toggle : c.adjustable))
        .map((c) => {
          // Labels as the tutor wrote them (`R_1`), so it recognises them.
          if (c.type === 'switch') return nameOf(c) + (c.closed !== false ? ' closed' : ' open');
          const field = DEPENDENT.has(c.type) ? 'gain' : 'value';
          return nameOf(c) + ' = ' + eng(Number(c[field]), UNITS[c.type] || '');
        });
      const summary = changed.concat(rows.map(([name, value]) => name + ' = ' + value)).join(', ');
      if (summary) send({ type: 'state', summary: summary.slice(0, 500) });
    }
    resize();
  }

  function onInit(message) {
    artifact = message.artifact || {};
    const data = artifact.data || {};
    spec = JSON.parse(JSON.stringify({
      components: list(data.components),
      analysis: data.analysis || { dc: true },
      show: data.show && !Array.isArray(data.show) ? data.show : {},
      annotations: list(data.annotations),
    }));
    answerMode = Boolean(message.answer);
    applyTheme(message.theme);
    schematic.setAttribute('aria-label', data.title || 'Circuit schematic');
    renderControls();
    renderToggles();
    submit.hidden = !answerMode;
    if (data.result) {
      showResult(data.result, false);
      const mine = solveSeq;
      call('render', { ...circuit(), result: data.result }, () => mine !== solveSeq)
        .then((markup) => { if (mine === solveSeq && typeof markup === 'string') setSchematic(markup); }, () => {});
    } else {
      solve(false);
    }
    resize();
  }

  submit.addEventListener('click', () => {
    send({
      type: 'submit',
      answer: { components: spec.components, analysis: spec.analysis },
    });
  });

  window.addEventListener('message', (event) => {
    if (event.source !== parent) return;
    const message = event.data;
    if (!message || typeof message !== 'object' || message.protocol !== 1) return;
    if (message.type === 'theme') return applyTheme(message.theme);
    if (message.type === 'init') return onInit(message);
    if (message.type === 'result') {
      const waiter = pending.get(message.id);
      if (!waiter) return;
      pending.delete(message.id);
      if (message.ok) waiter.resolve(message.value);
      else waiter.reject(new Error(message.error || 'call failed'));
    }
  });

  if (window.ResizeObserver) new ResizeObserver(resize).observe(document.body);
})();
</script>
</body>
</html>
