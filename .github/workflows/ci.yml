# Formatting, clippy, tests and the headless UI checks — plus the two bundles the
# owner wants built (Linux AppImage, one Android APK per ABI), which upload artifacts only.
#
# No secrets and no publishing. The check jobs are the commands in README.md's
# "Test" section, in the order that fails fastest; the bundle jobs come last and
# gate nothing.
name: CI

on:
  push:
    branches: [master]
  pull_request:

# Read-only: nothing here writes to the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  rust:
    name: clippy and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Tauri v2 links WebKitGTK 4.1, libsoup 3 and GTK 3; `crates/app` is a
      # workspace member, so clippy and the tests need them even though no
      # bundle is built here.
      - name: Install Tauri v2 Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev patchelf libssl-dev
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  ui-check:
    name: UI checks (headless Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      # Ubuntu 24.04 has no `chromium` deb: `chromium-browser` is a transitional
      # package that installs the snap, and GitHub's runners have no working
      # snapd, so this installs the Chrome build for that same package instead.
      - name: Install a Chromium-based browser
        run: |
          sudo apt-get update
          wget -q -O /tmp/chrome.deb \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb
      # run.js takes the check names as argv (`ipc placement`) and reads the
      # browser executable from $CHROMIUM, so it needs no nix wrapper here.
      - name: Run the UI checks
        run: CHROMIUM=google-chrome bun scripts/ui-check/run.js ipc placement

  # The two bundle jobs are the owner's smoke test of the packaging path: they
  # build and upload an artefact, they are not part of the tree's gates. Both
  # need a green `rust` job first, and neither gates the checks above or each
  # other.
  appimage:
    name: Linux AppImage
    # Built on 22.04 (glibc 2.35): an AppImage built on a newer glibc cannot run
    # on an older distribution.
    runs-on: ubuntu-22.04
    needs: [rust]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache the Tauri CLI
        id: tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: cargo-tauri-cli-v2-${{ runner.os }}
      - name: Install the Tauri CLI
        if: steps.tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked
      # libfuse2 is for running AppImages on 22.04; patchelf and librsvg are the
      # bundler's inputs; xvfb is only for the smoke start below.
      - name: Install Tauri v2 Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev patchelf libssl-dev \
            libfuse2 xvfb
      # There is no frontend build step: `build.frontendDist` is the checked-in
      # `ui/` directory, so the CLI goes straight to cargo and linuxdeploy.
      - name: Build the AppImage
        run: cargo tauri build --bundles appimage
      - name: Check the AppImage
        run: |
          appimage=$(ls target/release/bundle/appimage/*.AppImage | head -1)
          echo "built: $appimage"
          test -x "$appimage"
          size=$(stat -c%s "$appimage")
          echo "size: ${size} bytes"
          test "$size" -gt 10000000
      - name: Smoke-start the AppImage (reported, never fatal)
        # The app is a GUI with no CLI: it ignores arguments and opens a window,
        # so "started" = the process was still alive when the 25 s timeout fired
        # (exit 124). Whatever happens is printed, not enforced: this step exists
        # to catch a bundle whose libraries do not resolve, and the first CI run
        # shows whether WebKitGTK starts under xvfb.
        run: |
          appimage=$(ls target/release/bundle/appimage/*.AppImage | head -1)
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 25 xvfb-run -a "$appimage"
          code=$?
          set -e
          echo "app exit code: ${code} (124 = still running after 25 s, i.e. it started)"
      - name: Upload the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  android:
    name: Android APKs
    runs-on: ubuntu-latest
    needs: [rust]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Gradle 9 and AGP 9 (the versions in tauri-cli 2.12's mobile template)
      # need JDK 17 or newer; the template compiles to JVM 1.8 bytecode.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Installs cmdline-tools, accepts the SDK licences and downloads the
      # platform tauri-cli 2.12's template compiles against (compileSdk 37,
      # read from the CLI binary); AGP fetches the matching build-tools itself.
      # From API 37 Google publishes platforms with a minor version: the package
      # is `platforms;android-37.0` (there is no `platforms;android-37`), and it
      # installs to platforms/android-37.0.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0'
      # The template's `compileSdk = 37` makes AGP look the platform up by the
      # hash string `android-37`, which can fail against a directory named
      # android-37.0 ("Failed to find target with hash string 'android-37'",
      # actions/runner-images#13859); the alias is the reported workaround.
      - name: Alias platforms/android-37 to android-37.0
        run: ln -sfn android-37.0 "$ANDROID_HOME/platforms/android-37"
      # NDK r29: tauri-cli 2.12.4 carries 29.0.13846066, the only Android NDK
      # version literal in the binary.
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r29
          add-to-path: false
      # cargo-mobile2 reads NDK_HOME (not ANDROID_NDK_HOME). The runner's own
      # ANDROID_NDK_HOME is its preinstalled NDK (27.3), not the r29 above.
      #
      # The Tauri CLI exports TARGET_CC and TARGET_AR but no ranlib, so the cc
      # crate falls back to `aarch64-linux-android-ranlib`, which NDKs since r23
      # no longer ship; openssl-src's `make install_dev` runs it and fails (127).
      # llvm-ranlib is target-agnostic, so one TARGET_RANLIB serves all four
      # ABIs; the TARGET_ prefix leaves host build scripts on the host ranlib.
      - name: Point the Tauri CLI and cc at the NDK
        run: |
          echo "NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          ranlib="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib"
          test -x "$ranlib"
          echo "TARGET_RANLIB=$ranlib" >> "$GITHUB_ENV"
        env:
          NDK_PATH: ${{ steps.ndk.outputs.ndk-path }}
      # No i686: 32-bit x86 Android is emulator-only in practice, and building it
      # costs a quarter of the job. The build step's --target list matches.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: Cache the Tauri CLI
        id: tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: cargo-tauri-cli-v2-${{ runner.os }}
      - name: Install the Tauri CLI
        if: steps.tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked
      # Generates the Gradle project into the git-ignored crates/app/gen/android/.
      - name: Generate the Android project
        run: cargo tauri android init --ci
      # --debug, not a release build: release APKs are unsigned without a
      # keystore (and this repo has none), while Gradle's debug build type signs
      # with the standard debug key, so the artifacts actually install
      # (`adb install …`). --split-per-abi builds one APK per --target instead
      # of one universal APK carrying all three native libraries; Gradle writes
      # them under the generated project's app/build/outputs/apk/.
      - name: Build the APKs
        run: cargo tauri android build --apk --debug --split-per-abi --ci --target aarch64 armv7 x86_64
      # Names each APK after the one ABI its lib/ holds (read from the APK, not
      # from Gradle's flavour directories), so the artifact and release asset
      # names are stable; an APK with no or several ABIs fails the job.
      - name: Name the APKs by ABI
        run: |
          mkdir -p dist/android
          mapfile -t apks < <(find crates/app/gen/android -path '*/build/outputs/apk/*' -name '*.apk')
          for apk in "${apks[@]}"; do
            mapfile -t abis < <(unzip -Z1 "$apk" 'lib/*' | awk -F/ '$2 != "" { print $2 }' | sort -u)
            if [ "${#abis[@]}" -ne 1 ]; then
              echo "::error::$apk carries ABIs: ${abis[*]:-none}"
              exit 1
            fi
            mkdir -p "dist/android/${abis[0]}"
            cp "$apk" "dist/android/${abis[0]}/ps-learning-harness-${abis[0]}-debug.apk"
          done
          ls -l dist/android/*/
      - name: Upload the arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-arm64-v8a
          path: dist/android/arm64-v8a/*.apk
          if-no-files-found: error
      - name: Upload the armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-armeabi-v7a
          path: dist/android/armeabi-v7a/*.apk
          if-no-files-found: error
      - name: Upload the x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-x86_64
          path: dist/android/x86_64/*.apk
          if-no-files-found: error
