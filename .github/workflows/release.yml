# Publishes the bundles CI already built for a commit as a GitHub Release: no
# rebuild, no local download/upload. Run it from Actions → Release → "Run
# workflow". It creates the tag on the chosen commit, so no release commit is
# needed; an existing tag is reused as-is.
#
# The bundles come from the newest completed `push` run of ci.yml for that
# commit (pull_request runs build the PR's merge ref, not the commit itself).
# Artifacts expire (90 days by default); after that, re-run the commit's CI
# first.
#
# A full (not pre-) release also points the Nix flake's prebuilt package at
# the release's Linux binary: it commits nix/bin.json (URL and hash) to the
# default branch, after the tag.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create, e.g. v0.1.0'
        required: true
      ref:
        description: 'Commit SHA, branch or tag whose CI bundles to release'
        required: true
        default: master
      prerelease:
        description: 'Mark as a pre-release'
        type: boolean
        default: false

permissions:
  contents: write # create the tag and the release
  actions: read # find the CI run and download its artifacts

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
      REF: ${{ inputs.ref }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - name: Resolve the commit and its CI run
        id: ci
        run: |
          sha=$(gh api "repos/$GH_REPO/commits/$REF" --jq .sha)
          run_id=$(gh run list --workflow ci.yml --commit "$sha" --event push \
            --status completed --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo "::error::no completed push run of ci.yml for $sha"
            exit 1
          fi
          echo "commit $sha, CI run $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$run_id"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      # Fails if any bundle did not upload (failed, skipped or cancelled): the
      # AppImage and the bare Linux binary, one signed release APK per ABI
      # (arm64-v8a, armeabi-v7a, x86_64), the macOS DMG, the unsigned Windows
      # installer and the unsigned iOS IPA.
      - name: Download the bundles
        run: |
          gh run download "$RUN_ID" --dir dist --name appimage --name linux-x64-bin \
            --name android-apk-arm64-v8a --name android-apk-armeabi-v7a --name android-apk-x86_64 \
            --name macos-dmg --name windows-nsis --name ios-ipa-unsigned
        env:
          RUN_ID: ${{ steps.ci.outputs.run_id }}
      - name: Create the release
        env:
          SHA: ${{ steps.ci.outputs.sha }}
        run: |
          mapfile -t files < <(find dist -type f \( -name '*.AppImage' -o -name '*-x86_64-linux.tar.gz' -o -name '*.apk' -o -name '*.dmg' -o -name '*-setup.exe' -o -name '*.ipa' \))
          printf 'asset: %s\n' "${files[@]}"
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${files[@]}" --target "$SHA" --title "$TAG" \
            --generate-notes "${flags[@]}"
      - uses: actions/checkout@v4
        if: ${{ !inputs.prerelease }}
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: repo
      # The hash is the SRI form fetchurl takes. The version is the tag without
      # its leading "v" (or "v.").
      - name: Point the flake's prebuilt package at this release
        if: ${{ !inputs.prerelease }}
        working-directory: repo
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          tarball=$(find ../dist -type f -name 'ps-learning-harness-x86_64-linux.tar.gz')
          test -n "$tarball"
          hash="sha256-$(openssl dgst -sha256 -binary "$tarball" | base64 -w0)"
          version=$(printf '%s' "$TAG" | sed -E 's/^v\.?//')
          url="$GITHUB_SERVER_URL/$GH_REPO/releases/download/$TAG/ps-learning-harness-x86_64-linux.tar.gz"
          jq -n --arg version "$version" --arg url "$url" --arg hash "$hash" \
            '{version: $version, url: $url, hash: $hash}' > nix/bin.json
          cat nix/bin.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nix/bin.json
          git commit -m "nix: the prebuilt package is $TAG"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
