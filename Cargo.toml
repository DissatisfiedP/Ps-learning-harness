[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: a number written to the op log reads back as the same f64.
# Without it serde_json's parser can be one unit in the last place off for
# 17-digit values, so a replayed artifact's data differed from what was stored.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Debug info for the workspace's own crates only: the ~560 dependencies are
# never stepped through, and theirs more than doubled every debug binary (a
# harness test binary: 300 MB with it, 130 MB without).
[profile.dev.package."*"]
debug = false

# What ships: optimised for size, without symbols. On x86_64 Linux the desktop
# binary goes from 55.9 MiB to 24.5 MiB. LTO also reaches the library the
# Android and iOS builds load, because that target has no `rlib` crate type
# (crates/app/Cargo.toml). Panics still unwind: pdf.rs catches the PDF
# extractor's.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
