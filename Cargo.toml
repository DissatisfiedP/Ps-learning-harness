[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Debug info for the workspace's own crates only: the ~560 dependencies are
# never stepped through, and theirs more than doubled every debug binary (a
# harness test binary: 300 MB with it, 130 MB without).
[profile.dev.package."*"]
debug = false

# What ships: optimised for size, without symbols. On x86_64 Linux the desktop
# binary goes from 55.9 MiB to 24.5 MiB. LTO reaches that binary only: Cargo
# skips it for the library target the Android and iOS builds use, because that
# target is also an `rlib` (crates/app/Cargo.toml), so those get the other
# three settings. Panics still unwind: pdf.rs catches the PDF extractor's.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
