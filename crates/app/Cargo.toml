[package]
name = "ps-learning-harness"
version.workspace = true
edition.workspace = true

# Tauri mobile loads the app as a library (`run`). The desktop binary does not
# link it: main.rs compiles the same source in. That keeps `rlib` out of the
# crate types, and Cargo runs LTO only for a library without one.
[lib]
name = "ps_learning_harness_lib"
crate-type = ["staticlib", "cdylib"]

# Same source as the library, whose tests cover it.
[[bin]]
name = "ps-learning-harness"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
harness = { path = "../harness" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde_json.workspace = true
tokio.workspace = true
tauri-plugin-dialog = "2"

# The webview on Linux is WebKitGTK; pinch.rs hooks its GTK events. Same
# version Tauri's runtime already links, so nothing new is built.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[lints]
workspace = true
