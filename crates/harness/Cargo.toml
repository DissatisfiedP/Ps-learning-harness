[package]
name = "harness"
version.workspace = true
edition.workspace = true

[dependencies]
providers = { path = "../providers" }
research-search = { path = "../research-search" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
ulid = "1"
base64 = "0.22"
flate2 = "1"
mlua = { version = "0.12", features = ["luau", "send", "serialize"] }
quick-xml = "0.42"
semver = "1"
sha2 = "0.10"
tar = "0.4"
toml = "1"
pdf-extract = "0.12.1"
lopdf = "0.42.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
# Reference libraries (library/office.rs): Office/OpenDocument/EPUB files are
# zip archives of XML. Only the stored and deflate methods are read (what
# every Office and EPUB writer emits); the crypto and other codecs stay off.
zip = { version = "2.4", default-features = false, features = ["deflate-flate2", "flate2"] }
# RTF `\'hh` bytes in the document's code page; already built for lopdf.
encoding_rs = "0.8"
# Sync (docs/sync-build.md): libgit2 from source so no system libgit2 is needed;
# HTTPS goes through OpenSSL, and SSH is out of scope.
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2", "https"] }
# Secrets (secrets.rs): one keyring-core facade over each platform's own
# secure store. Linux and the BSDs talk to the Secret Service over D-Bus
# (pure Rust zbus, already in the build through the shell); its session
# encryption uses RustCrypto, so no libsecret or OpenSSL is linked.
keyring-core = "1"

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }

# macOS: the login keychain (the app is not sandboxed); iOS has only the
# data-protection keychain.
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["protected"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

# git2's HTTPS transport pulls in openssl-sys on every Unix. Android and iOS
# have no system OpenSSL to link, and on macOS the one found is Homebrew's,
# which the machines the app ships to may lack; so build it from source on
# those targets (on Apple, libgit2 itself uses Secure Transport). Linux keeps
# the system library.
[target.'cfg(any(target_os = "android", target_vendor = "apple"))'.dependencies]
openssl-sys = { version = "0.9", features = ["vendored"] }

# Android: that OpenSSL is built with `no-stdio` and can read no certificate
# file, so git's HTTPS trust is decided by rustls with the Mozilla roots in
# libgit2's certificate callback (sync/tls.rs). Both are already in the build
# through reqwest; the features match its.
[target.'cfg(target_os = "android")'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
# Secrets: SharedPreferences encrypted with an AES key that lives in the
# Android Keystore. It reaches the app's Context through ndk-context, which
# Tauri's runtime (tao) initialises before the app's code runs.
android-native-keyring-store = "1"

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[lints]
workspace = true
