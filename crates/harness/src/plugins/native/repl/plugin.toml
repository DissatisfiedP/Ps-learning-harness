# Built-in native plugin (docs/plugins.md §12), compiled into the app from
# this directory by crates/harness/src/plugins/native/repl.rs. Tool `entry`
# names the Rust method; there is no src/main.luau.
id = "repl"
version = "0.1.0"
api = 1
title = "Language REPL (python, javascript, sql, nix)"
description = "Evaluates expressions in a local language toolchain for the tutor, and gives the learner REPL tasks with a checked end state."
license = "MIT"
platforms = ["desktop"]
permissions = ["exec"]
use_when = "Sections about a language or tool where checking real evaluation beats explaining: Nix expressions and the module system, SQL queries, Python or JavaScript semantics, a library's actual behaviour."
avoid_when = "Pure syntax facts the learner can memorize faster than running them."
cost = "Needs the language toolchain installed locally (python3, node, sqlite3 or nix-instantiate)."

[[tool]]
name = "repl_eval"
description = "Evaluate an input in your own REPL session for this language (state persists between calls) and return what it prints and its value. The learner does not see it unless you quote it."
agents = ["tutor", "practice"]
input = "schemas/repl_eval.json"
entry = "eval"
artifact = false

[[tool]]
name = "repl_task"
description = "Make a REPL card with a task for the learner. Then ask with question_ask { view: { artifactId, task, target: {} } }; the answer holds their inputs, outputs and whether `check` holds in their session's final state."
agents = ["tutor", "practice"]
input = "schemas/repl_task.json"
entry = "task"
artifact = true

[[view]]
name = "REPL"
html = "views/repl.html"
calls = ["input"]
answer = true

[prompts]
tutor = "prompts/tutor.md"
practice = "prompts/practice.md"
