[env]
# OPENSSLDIR of the OpenSSL that openssl-sys builds from source for Android
# (`vendored`; desktop links the system OpenSSL and ignores this). OpenSSL's
# default would be /usr/local/ssl, which doesn't exist on a phone, so HTTPS git
# remotes failed certificate verification. The folder is inside the app's
# private storage (the Tauri identifier in crates/app/tauri.conf.json); at
# startup the harness writes Android's trusted roots to `cert.pem` there
# (`sync::install_android_trust_store`, which reads this same value). Change
# both together if the identifier changes.
OPENSSL_CONFIG_DIR = "/data/data/com.pslearningharness.app/files/ssl"
